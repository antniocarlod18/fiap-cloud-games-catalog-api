# Deploy to Azure Kubernetes Service
# Build and push image to Azure Container Registry; Deploy to Azure Kubernetes Service
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- master

resources:
- repo: self

variables:

  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'c0c196b7-6307-40f2-8d06-3ab60ee1ffc8'
  imageRepository: 'antniocarlodfiapcloudgamescatalogapi'
  containerRegistry: 'fgcacr13245.azurecr.io'
  dockerfilePath: 'FiapCloudGamesCatalog.Api/Dockerfile'
  tag: '$(Build.BuildId)'
  imagePullSecret: 'fgcacr132450a5c-auth'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and Unit Tests

  jobs:
  - job: Build

    pool:
      vmImage: $(vmImageName)

    steps:

    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.x'

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: '**/*.csproj'
        arguments: '--configuration Release'

    - task: DotNetCoreCLI@2
      displayName: Run Unit Tests
      inputs:
        command: test
        projects: '**/*Tests.csproj'
        arguments: '--configuration Release --collect:"XPlat Code Coverage"'

    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        buildContext: '.'
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - task: PublishPipelineArtifact@1
      displayName: Publish Kubernetes Manifests

      inputs:
        targetPath: 'FiapCloudGamesCatalog.Api/k8s'
        artifact: manifests  

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build

  jobs:
  - deployment: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'antniocarlod18fiapcloudgamescatalogapi.default'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: manifests
              path: $(Pipeline.Workspace)/manifests

          - task: replacetokens@5
            displayName: Replace Tokens

            inputs:
              rootDirectory: '$(Pipeline.Workspace)/manifests'

              targetFiles: '**/*.yml'

              encoding: 'auto'

              writeBOM: true

              actionOnMissing: 'warn'

              keepToken: false

              tokenPattern: 'azpipelines'

          - task: KubernetesManifest@0
            displayName: Create imagePullSecret
            inputs:
              action: createSecret
              secretName: $(imagePullSecret)
              dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

          - script: |
              echo "=== PIPELINE WORKSPACE ==="
              ls -R $(Pipeline.Workspace)

            displayName: Debug Files
            
          - task: KubernetesManifest@0
            displayName: Deploy to Kubernetes cluster
            inputs:
              action: deploy
              manifests: |
                $(Pipeline.Workspace)/manifests/FiapCloudGamesCatalog.Api/k8s/configmap.yml
                $(Pipeline.Workspace)/manifests/FiapCloudGamesCatalog.Api/k8s/secret.yml
                $(Pipeline.Workspace)/manifests/FiapCloudGamesCatalog.Api/k8s/migration.yml
                $(Pipeline.Workspace)/manifests/FiapCloudGamesCatalog.Api/k8s/deployment.yml
                $(Pipeline.Workspace)/manifests/FiapCloudGamesCatalog.Api/k8s/service.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)